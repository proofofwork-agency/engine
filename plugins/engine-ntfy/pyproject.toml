[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-ntfy"
version = "0.1.0"
description = "Bounded ntfy lifecycle observer plugin for Engine"
requires-python = ">=3.12"
dependencies = ["engine-sdk>=0.2,<0.3"]

[project.entry-points."engine.plugins"]
ntfy = "engine_ntfy.plugin:load_plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/engine/plugins/engine-ntfy" = ["engine-plugin.toml"]
