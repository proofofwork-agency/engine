[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "engine-context"
version = "0.2.0"
description = "Local time, permissioned location and provider-neutral weather for Engine"
requires-python = ">=3.12"
dependencies = ["engine-sdk>=0.2,<0.3"]

[project.entry-points."engine.plugins"]
context = "engine_context.plugin:load_plugin"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"share/engine/plugins/engine-context" = ["engine-plugin.toml"]
